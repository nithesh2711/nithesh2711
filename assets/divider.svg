<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" role="img" aria-label="Decorative divider">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#39d353" stop-opacity="0"/>
<stop offset=".25" stop-color="#26a641"/>
<stop offset=".6" stop-color="#a371f7"/>
<stop offset=".85" stop-color="#f778ba"/>
<stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="0" y="5" width="800" height="2" rx="1" fill="url(#g)"/>
<circle cy="6" r="3" fill="#ffffff" opacity=".85">
<animate attributeName="cx" values="0;800" dur="6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/>
</circle>
</svg>
